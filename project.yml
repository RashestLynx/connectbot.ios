name: ConnectBotiOS
options:
  bundleIdPrefix: com.rashestlynx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 8840e3596739adfe9599c0e7fff89f4fa88bedcf  # v1.9.0 (a revision pin allows its pre-release swift-subprocess dependency)
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.65.0
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh
    minVersion: 0.3.4
    maxVersion: 0.4.0
targets:
  ConnectBot:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashestlynx.connectbot
        PRODUCT_NAME: ConnectBot
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio
        product: NIOCore
      - package: swift-nio-ssh
        product: NIOSSH
