name: iPhone Build

# Builds an unsigned RigPilot.ipa. Install it with Sideloadly (Windows/Mac),
# which signs it with your own Apple ID. Runs on every push to main, or from
# the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project RigPilotShell.xcodeproj \
            -scheme RigPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RigPilot.app Payload/
          zip -qr RigPilot.ipa Payload
          ls -la RigPilot.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rigpilot-iphone-ipa
          path: RigPilot.ipa
          if-no-files-found: error

      # A GitHub Release per build gives a permanent direct link to the newest IPA:
      # https://github.com/RashestLynx/connectbot.ios/releases/latest/download/RigPilot.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "ios-build-$RUN" RigPilot.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "RigPilot Shell for iPhone (build $RUN)" \
            --notes "Download RigPilot.ipa on your computer and install it with Sideloadly. Built from ${SHA:0:7}."
